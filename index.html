<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlirtHubX</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111827;
color:white;
overflow:hidden;
}

.screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.hidden{
display:none;
}

#home{
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.75)),
url("grok_1785922772462.jpg");
background-size:cover;
background-position:center;
}

.logo{
text-align:center;
margin-bottom:auto;
padding-top:80px;
}

.logo h1{
font-size:58px;
}

.logo span{
color:#e11d48;
}

.logo p{
margin-top:10px;
opacity:.8;
}

.startBtn,
.nextBtn{
background:#e11d48;
color:white;
border:none;
border-radius:999px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.startBtn{
width:280px;
height:55px;
margin-bottom:70px;
}

#profile{
background:#111827;
padding:25px;
}

.card{
width:100%;
max-width:350px;
background:#1f2937;
padding:20px;
border-radius:20px;
}

.card h2{
text-align:center;
margin-bottom:20px;
}

.input{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:16px;
background:#374151;
color:white;
}

.nextBtn{
width:100%;
padding:15px;
margin-top:25px;
}

.matchCard{
width:100%;
max-width:350px;
background:#1f2937;
border-radius:18px;
padding:15px;
margin-bottom:20px;
cursor:pointer;
}

.matchCard img{
width:100%;
border-radius:12px;
}
</style>

</head>

<body>


<div id="home" class="screen">

<div class="logo">
<h1>Flirt<span>HubX</span></h1>
<p>Every choice creates a new story.</p>
</div>

<button class="startBtn" onclick="showProfile()">
❤️ START GAME
</button>

</div>



<div id="profile" class="screen hidden">

<div class="card">

<h2>Create Profile</h2>

<input id="username" class="input" placeholder="Username">

<input id="age" class="input" type="number" placeholder="Age">


<select id="gender" class="input">
<option>Male</option>
<option>Female</option>
<option>Non-binary</option>
</select>


<button class="nextBtn" onclick="continueGame()">
Choose Avatar →
</button>


</div>

</div>



<div id="match" class="screen hidden" 
style="background:#111827;padding:20px;overflow:auto;justify-content:flex-start;">


<h2 style="margin-top:40px;margin-bottom:25px;">
Choose Your Match ❤️
</h2>



<div class="matchCard" onclick="chooseGirl('Sophia')">

<img src="https://picsum.photos/400/500?random=1">

<h3>Sophia, 20</h3>

<p>📚 Loves books • ☕ Coffee addict</p>

</div>




<div class="matchCard" onclick="chooseGirl('Luna')">

<img src="https://picsum.photos/400/500?random=2">

<h3>Luna, 22</h3>

<p>🎮 Gamer • 😂 Funny</p>

</div>




<div class="matchCard" onclick="chooseGirl('Emma')">

<img src="https://picsum.photos/400/500?random=3">

<h3>Emma, 21</h3>

<p>🎵 Music Lover • 💖 Sweet</p>

</div>



</div>




<script>

function showProfile(){

document.getElementById("home").classList.add("hidden");

document.getElementById("profile").classList.remove("hidden");

}



function continueGame(){

const username = document.getElementById("username").value.trim();


if(username === ""){

alert("Please enter your username.");

return;

}


document.getElementById("profile").classList.add("hidden");

document.getElementById("match").classList.remove("hidden");


}



function chooseGirl(name){

alert("You matched with " + name + " ❤️");

}


</script>


</body>
</html>
