<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlirtHubX</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
overflow:hidden;
}

.bg{
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.7)),
url("grok_1785922772462.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
display:flex;
flex-direction:column;
justify-content:space-between;
align-items:center;
}

.logo{
margin-top:70px;
text-align:center;
color:white;
}

.logo h1{
font-size:55px;
font-weight:900;
margin:0;
}

.logo span{
color:#e11d48;
}

.logo p{
opacity:.8;
margin-top:10px;
}

.start{
margin-bottom:60px;
width:280px;
height:55px;
border:none;
border-radius:999px;
background:#e11d48;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
</style>

</head>

<body>

<div class="bg">

<div class="logo">
<h1>FlirtHub<span>X</span></h1>
<p>Every choice creates a new story.</p>
</div>

<button class="start">
❤️ START GAME
</button>

</div>

</body>
</html>
