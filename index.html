<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlirtHubX</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
overflow:hidden;
}

.bg{
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.7)),
url("grok_1785922772462.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
display:flex;
flex-direction:column;
justify-content:space-between;
align-items:center;
}

.logo{
margin-top:70px;
text-align:center;
color:white;
}

.logo h1{
font-size:55px;
font-weight:900;
margin:0;
}

.logo span{
color:#e11d48;
}

.logo p{
opacity:.8;
margin-top:10px;
}

.start{
margin-bottom:60px;
width:280px;
height:55px;
border:none;
border-radius:999px;
background:#e11d48;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
</style>

</head>

<body> <div id="profileScreen" style="
display:none;
position:fixed;
inset:0;
background:#111827;
padding:30px;
color:white;
">

<h2 style="text-align:center;font-size:32px;">
Create Profile
</h2>

<input
id="username"
placeholder="Username"
style="
width:100%;
padding:15px;
margin-top:30px;
border-radius:12px;
border:none;
font-size:16px;
">

<input
id="age"
type="number"
placeholder="Age"
style="
width:100%;
padding:15px;
margin-top:15px;
border-radius:12px;
border:none;
font-size:16px;
">

<select
id="gender"
style="
width:100%;
padding:15px;
margin-top:15px;
border-radius:12px;
border:none;
font-size:16px;
">
<option>Male</option>
<option>Female</option>
<option>Non-binary</option>
</select>

<button
style="
width:100%;
margin-top:30px;
padding:15px;
background:#e11d48;
color:white;
border:none;
border-radius:999px;
font-size:18px;
font-weight:bold;
"
onclick="continueGame()"
>
Continue ❤️
</button>

</div>

<script>
function showProfile(){
document.querySelector(".bg").style.display="none";
document.getElementById("profileScreen").style.display="block";
}

function continueGame(){
const name=document.getElementById("username").value;

if(name===""){
alert("Please enter your username.");
return;
}

document.getElementById("profileScreen").style.display="none";
document.getElementById("matchScreen").style.display="block";
</script> <div id="matchScreen" style="
display:none;
position:fixed;
inset:0;
background:#111827;
padding:20px;
overflow:auto;
color:white;
">

<h2 style="text-align:center;font-size:30px;margin-bottom:20px;">
Choose Your Match ❤️
</h2>

<div class="card" onclick="chooseGirl('Sophia')">
<img src="https://picsum.photos/400/500?random=1" style="width:100%;border-radius:15px;">
<h3>Sophia, 20</h3>
<p>📚 Loves books • ☕ Coffee addict</p>
</div>

<div class="card" onclick="chooseGirl('Luna')">
<img src="https://picsum.photos/400/500?random=2" style="width:100%;border-radius:15px;">
<h3>Luna, 22</h3>
<p>🎮 Gamer • 😂 Funny</p>
</div>

<div class="card" onclick="chooseGirl('Emma')">
<img src="https://picsum.photos/400/500?random=3" style="width:100%;border-radius:15px;">
<h3>Emma, 21</h3>
<p>🎵 Music Lover • 💖 Sweet</p>
</div>

</div> function chooseGirl(name){
alert("You matched with " + name + " ❤️");
}

<div class="bg">

<div class="logo">
<h1>FlirtHub<span>X</span></h1>
<p>Every choice creates a new story.</p>
</div>

<button class="start" onclick="showProfile()">
❤️ START GAME
</button>

</div>

</body>
</html>
