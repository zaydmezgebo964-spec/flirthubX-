<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlirtHubX</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0a0a0a;
  color:#39ff14;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:90%;
  max-width:420px;
  text-align:center;
}

h1{
  font-size:48px;
  text-shadow:0 0 15px #39ff14;
  margin-bottom:15px;
}

p{
  color:#bfbfbf;
  margin-bottom:30px;
}

button{
  width:100%;
  padding:15px;
  margin:10px 0;
  border:none;
  border-radius:12px;
  background:#39ff14;
  color:#000;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#62ff4a;
}
</style>
</head>

<body> <script>
function showProfile(){
document.body.innerHTML=`
<div class="container">
<h1>Create Profile</h1>

<input type="text" placeholder="Username"><br><br>

<input type="number" placeholder="Age"><br><br>

<select>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select><br><br>

<button>Continue ❤️</button>
</div>
`;
}
</script>

<div class="container">

<h1>💚 FlirtHubX</h1>

<p>Find your perfect match.</p>
<button onclick="showProfile()">❤️ Start Dating</button>

</div>

</body>
</html>
