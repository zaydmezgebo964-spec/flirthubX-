<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlirtHubX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111827;
color:white;
overflow:hidden;
}

.screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.hidden{
display:none;
}

.card{
width:90%;
max-width:380px;
background:#1f2937;
padding:20px;
border-radius:20px;
}

.input{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
background:#374151;
color:white;
font-size:16px;
}

.nextBtn{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:999px;
background:#e11d48;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#home{
background:
linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.75)),
url("grok_1785922772462.jpg");
background-size:cover;
background-position:center;
}

.startBtn{
width:280px;
height:56px;
border:none;
border-radius:999px;
background:#e11d48;
color:white;
font-size:20px;
font-weight:bold;
margin-top:auto;
margin-bottom:80px;
cursor:pointer;
}

.bottomNav{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:#111827;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid #222;
}

.navBtn{
background:none;
border:none;
color:white;
font-size:28px;
cursor:pointer;
}

.avatarGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

.avatarGrid img{
width:100%;
border-radius:15px;
cursor:pointer;
}

.matchCard{
width:100%;
max-width:350px;
background:#1f2937;
border-radius:18px;
padding:15px;
margin-bottom:20px;
cursor:pointer;
}

.matchCard img{
width:100%;
border-radius:12px;
}

</style>
</head>

<body>

<div id="home" class="screen">

<h1 style="font-size:60px;">❤️ FlirtHubX</h1>

<p style="margin-top:15px;">
Every choice creates a new story.
</p>

<button class="startBtn" onclick="showProfile()">
START GAME
</button>

</div> <!-- PROFILE SCREEN -->
<div id="profile" class="screen hidden">

<div class="card">

<h2 style="text-align:center;">Create Profile</h2>

<input id="username" class="input" placeholder="Username">

<input id="age" class="input" type="number" placeholder="Age">

<select id="gender" class="input">
<option>Male</option>
<option>Female</option>
<option>Non-binary</option>
</select>

<button class="nextBtn" onclick="continueGame()">
Choose Avatar →
</button>

</div>

</div>

<!-- AVATAR SCREEN -->
<div id="avatar" class="screen hidden">

<div class="card">

<h2 style="text-align:center;">Choose Avatar</h2>

<div class="avatarGrid">

<img src="https://i.pravatar.cc/200?img=1" onclick="selectAvatar(this)">
<img src="https://i.pravatar.cc/200?img=2" onclick="selectAvatar(this)">
<img src="https://i.pravatar.cc/200?img=3" onclick="selectAvatar(this)">
<img src="https://i.pravatar.cc/200?img=4" onclick="selectAvatar(this)">

</div>

<button class="nextBtn" onclick="openMatch()">
Continue ❤️
</button>

</div>

</div>

<!-- MATCH SCREEN -->
<div id="match" class="screen hidden" style="padding:20px;justify-content:flex-start;overflow:auto;">

<h2 style="margin:40px 0 25px;">Choose Your Match ❤️</h2>

<div class="matchCard" onclick="chooseGirl('Sophia')">
<img src="https://picsum.photos/400/500?random=1">
<h3>Sophia, 20</h3>
<p>📚 Loves books • ☕ Coffee addict</p>
</div>

<div class="matchCard" onclick="chooseGirl('Luna')">
<img src="https://picsum.photos/400/500?random=2">
<h3>Luna, 22</h3>
<p>🎮 Gamer • 😂 Funny</p>
</div>

<div class="matchCard" onclick="chooseGirl('Emma')">
<img src="https://picsum.photos/400/500?random=3">
<h3>Emma, 21</h3>
<p>🎵 Music Lover • 💖 Sweet</p>
</div>

</div>

<!-- GAME HOME -->
<div id="gameHome" class="screen hidden">

<img id="playerAvatar" src="" style="width:90px;height:90px;border-radius:50%;">

<h2 id="playerName" style="margin-top:15px;">Player</h2>

<p>Welcome back ❤️</p>

<div class="bottomNav">

<button class="navBtn">🏠</button>
<button class="navBtn">💬</button>
<button class="navBtn">❤️</button>
<button class="navBtn">🎁</button>
<button class="navBtn">👤</button>

</div>

</div> <script>

let selectedAvatar="";

function showProfile(){
document.getElementById("home").classList.add("hidden");
document.getElementById("profile").classList.remove("hidden");
}

function continueGame(){

const username=document.getElementById("username").value.trim();

if(username===""){
alert("Please enter your username.");
return;
}

document.getElementById("profile").classList.add("hidden");
document.getElementById("avatar").classList.remove("hidden");

}

function selectAvatar(img){

selectedAvatar=img.src;

document.querySelectorAll(".avatarGrid img").forEach(i=>{
i.style.border="none";
});

img.style.border="4px solid #e11d48";

}

function openMatch(){

if(selectedAvatar===""){
alert("Please choose an avatar.");
return;
}

document.getElementById("avatar").classList.add("hidden");
document.getElementById("match").classList.remove("hidden");

}

function chooseGirl(name){

document.getElementById("match").classList.add("hidden");
document.getElementById("gameHome").classList.remove("hidden");

document.getElementById("playerName").innerText=
document.getElementById("username").value;

document.getElementById("playerAvatar").src=selectedAvatar;

}

</script>

</body>
</html>
